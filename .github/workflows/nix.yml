name: Nix

on:
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml
      - README.md
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - .github/workflows/nix.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@2a0be2498974c2b6327e19780488744384637d88 # v3.21.7

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Create consumer flake
        working-directory: examples/flutter_example
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          cat > flake.nix <<'EOF'
          {
            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
              xcross.url = "path:../..";
            };

            outputs = { nixpkgs, xcross, ... }:
              let
                system = "__SYSTEM__";
                pkgs = nixpkgs.legacyPackages.${system};
              in {
                devShells.${system}.default = pkgs.mkShell {
                  inputsFrom = [ xcross.devShells.${system}.default ];
                };
              };
          }
          EOF
          sed -i "s/__SYSTEM__/$SYSTEM/" flake.nix
          git add --intent-to-add flake.nix
          nix flake lock

      - name: Export consumer environment
        working-directory: examples/flutter_example
        run: |
          nix develop --command bash -euo pipefail -c '
            printf "XCROSS_NIX_PATH=%s\n" "$PATH" >> "$GITHUB_ENV"
            printf "FLUTTER_ROOT=%s\n" "$FLUTTER_ROOT" >> "$GITHUB_ENV"
          '

      - name: Restore cached Darwin SDK
        uses: ./.github/actions/setup-darwin-sdk
        env:
          PATH: ${{ env.XCROSS_NIX_PATH }}

      - name: Build Flutter example
        working-directory: examples/flutter_example
        run: |
          nix develop --command bash -euo pipefail -c '
            xcross flutter build
            test "$(find build/xcross-ios -maxdepth 1 -type d -name "*.app" | wc -l)" -eq 1
          '
