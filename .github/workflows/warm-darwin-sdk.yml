# Seeds the private, per-host Darwin SDK caches used by integration.yml.
# The artifactbundle_url input, or repository secret DARWIN_ARTIFACTBUNDLE_URL
# when it is empty, must point to an archive with xcross-darwin.artifactbundle
# at its root, produced by `xcross sdk install`.
# Never publish the archive: it contains Apple SDK content.
name: Warm Darwin SDK cache

on:
  workflow_dispatch:
    inputs:
      artifactbundle_url:
        description: >-
          Private URL to the SDK .tar.gz. Defaults to the
          DARWIN_ARTIFACTBUNDLE_URL secret. Dispatch inputs are recorded in
          plain text in the run metadata, so prefer a short-lived URL.
        required: false
        default: ""
        type: string
      cache_revision:
        description: Non-secret revision used to replace an older SDK cache.
        required: true
        default: v3
        type: string

permissions:
  contents: read

env:
  SWIFT_VERSION: 6.3.3
  SWIFT_WINDOWS_SHA256: >-
    235626548F249CD516D3D4D90EEE980DCCAD46F3822DAC1F8E3119B0FEDE94B7

jobs:
  warm-cache:
    name: Warm ${{ matrix.os }} cache
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - name: Install Linux LLVM requirements
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          swift --version
          clang --version

      - name: Install official Swift and LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\swift-installer.exe"
          $release = "swift-$env:SWIFT_VERSION-release"
          $version = "swift-$env:SWIFT_VERSION-RELEASE"
          $base = 'https://download.swift.org'
          $url = "$base/$release/windows10/$version/" +
            "$version-windows10.exe"
          Invoke-WebRequest $url -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:SWIFT_WINDOWS_SHA256) {
            throw "Swift installer checksum mismatch: $hash"
          }
          $process = Start-Process `
            $installer `
            -ArgumentList '/quiet', '/norestart' `
            -PassThru `
            -Wait
          if ($process.ExitCode -notin 0, 3010) {
            throw "Swift installer failed: $($process.ExitCode)"
          }

          $llvmBin = "${env:ProgramFiles}\LLVM\bin"
          if (-not (Test-Path "$llvmBin\ld64.lld.exe")) {
            throw "Hosted-runner LLVM missing ld64.lld.exe at $llvmBin"
          }
          $swiftRoot = "$env:LOCALAPPDATA\Programs\Swift"
          # The installer registers its Runtimes, Toolchains, and Tools
          # directories in the persisted PATH, but this job's environment
          # predates the install. swift.exe cannot even start without the
          # Runtimes DLLs, and Windows reports that as a bare exit code
          # 3221225781 (0xC0000135, STATUS_DLL_NOT_FOUND), so re-export every
          # directory the installer registered under the Swift root.
          $swiftDirs = @(
            [Environment]::GetEnvironmentVariable('Path', 'Machine')
            [Environment]::GetEnvironmentVariable('Path', 'User')
          ) -join ';' -split ';' |
            Where-Object { $_ } |
            ForEach-Object { $_.TrimEnd('\') } |
            Where-Object { $_ -like "$swiftRoot*" } |
            Select-Object -Unique
          $swift = Get-ChildItem `
            "$swiftRoot\Toolchains" `
            -Filter swift.exe `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $swift) {
            throw 'Swift.Toolchain did not install swift.exe'
          }
          $runtime = Get-ChildItem `
            "$swiftRoot\Runtimes" `
            -Filter swiftCore.dll `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $runtime) {
            throw 'Swift.Runtime did not install swiftCore.dll'
          }
          $swiftDirs = @(
            (Split-Path $runtime.FullName)
            (Split-Path $swift.FullName)
          ) + $swiftDirs | Select-Object -Unique
          $swiftDirs | ForEach-Object { "  $_" } | Write-Host
          $llvmBin |
            Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $swiftDirs | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$llvmBin;$($swiftDirs -join ';');$env:Path"
          $tools = @('swift', 'clang', 'clang++', 'llvm-ar', 'ld64.lld')
          foreach ($tool in $tools) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "Missing $tool"
            }
          }
          # Runs swift.exe and the swift-sdk.exe subcommand binary, so a
          # broken toolchain fails here instead of in a later step.
          & swift --version
          if ($LASTEXITCODE -ne 0) {
            throw "swift --version failed with $LASTEXITCODE"
          }
          & swift sdk list
          if ($LASTEXITCODE -ne 0) {
            throw "swift sdk list failed with $LASTEXITCODE"
          }

      - name: Mask dispatched artifactbundle URL
        if: inputs.artifactbundle_url != ''
        shell: bash
        env:
          ARTIFACTBUNDLE_URL: ${{ inputs.artifactbundle_url }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ARTIFACTBUNDLE_URL"

      - name: Restore or download xcross Darwin SDK
        uses: ./.github/actions/setup-darwin-sdk
        with:
          artifactbundle-url: >-
            ${{ inputs.artifactbundle_url != ''
            && inputs.artifactbundle_url
            || secrets.DARWIN_ARTIFACTBUNDLE_URL }}
          cache-revision: ${{ inputs.cache_revision }}
